<div class="flex flex-col items-center my-16 flex-direction-column"  *transloco="let t; prefix: 'me'">
    <div class="w-[230px] h-[230px] bg-gray-950 rounded-full grid place-items-center">
        <img [src]="'me' | icon" alt="me" class="w-[220px]">
    </div>
    <h1 class="font-bold text-4xl mt-8 text-center">
        {{ t('name') }}
    </h1>
    <p class="font-medium text-xl text-gradient">
        {{ t('specialty') }}
    </p>

    <p class="mt-8 mx-12 w-[587px] max-w-[80%] text-center">
        {{ t('description') }}
    </p>
</div>
